apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-cert-exporter
  namespace: tls-monitor
  labels:
    app.kubernetes.io/name: kube-cert-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-cert-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-cert-exporter
    spec:
      serviceAccountName: kube-cert-exporter
      nodeSelector:
        kubernetes.io/hostname: node1
      # 挂载 SA token，rest.InClusterConfig() 就是读它
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # 写完整名，避免 containerd 在不同版本下对短名的规范化差异导致找不到镜像
          image: ghcr.io/ly542566/kube-cert-exporter:sha-a8b938d
          # 关键：镜像从 ghcr.io 拉取，节点本地没有缓存时 kubelet 会自动 pull
          imagePullPolicy: IfNotPresent
          args:
            - -addr=:8080
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # 用 TCP 探针而不是 /metrics：
          # /metrics 每被探一次就会全量扫一遍集群 secrets，10 秒一次太浪费
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: kube-cert-exporter
  namespace: tls-monitor
  labels:
    app.kubernetes.io/name: kube-cert-exporter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-cert-exporter
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
