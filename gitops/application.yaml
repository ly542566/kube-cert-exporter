apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-cert-exporter
  namespace: argocd
  finalizers:
    # 删除 Application 时连带清理它创建的资源，避免留下孤儿对象
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/ly542566/kube-cert-exporter.git
    targetRevision: main
    path: deploy

  destination:
    server: https://kubernetes.default.svc
    namespace: tls-monitor

  syncPolicy:
    automated:
      # Git 里删掉的资源，集群里也删掉。这是 GitOps 的语义，
      # 但意味着「误删文件 + push」会让线上少东西，操作前看 git diff
      prune: true
      # 有人手改集群，ArgoCD 会自动改回 Git 里的样子
      selfHeal: true
    syncOptions:
      # Namespace 由 deploy/00-namespace.yaml 创建，不让 ArgoCD 代管
      - CreateNamespace=false
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
